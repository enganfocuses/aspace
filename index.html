.menu .mp.open{display:flex}.menu .mp button{text-align:left}.menu .mp{max-height:calc(100dvh - 110px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}.menu{max-width:calc(100vw - 24px)}.menu .mp{max-width:calc(100vw - 24px)}
.vtop{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:12px;z-index:30;box-shadow:0 8px 28px #3a3a4624}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);display:none;background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:6px 16px;z-index:60}
.it{position:absolute;color:#3a3a46}

.it.img img{width:100%;height:100%;object-fit:cover;display:block}.it.aud .bgl,.it.vid .bgl{display:flex;align-items:center;justify-content:center;background:#292230;border-radius:12px;padding:8px;overflow:hidden}.it.aud audio{max-width:100%}.it.vid video{max-width:100%;max-height:100%}

.it.note .t{text-align:left}.it.txt .tw{padding:2px}
.it.txt:hover .bgl,.it.txt.sel .bgl{outline:1px dashed #7f9bbd;outline-offset:2px}

.it.sel .g{display:block}

@media(hover:none){.vbar{opacity:1}.it>i{opacity:1}}

.vwin:fullscreen{width:100vw;height:100vh;border-radius:0;resize:none}.vwin:fullscreen .vgrid{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}

/* Aspace · Miro-inspired lavender & wine workspace */
:root{--bg:#f7f5fa;--card:#fff;--ink:#30283b;--mut:#81778b;--lav:#c8b8e8;--lav-deep:#8065ad;--wine:#71384f;--wine-dark:#54283c;--line:#e7e1ed;--soft:#f0ebf6;--shadow:0 5px 22px #34233f12}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:row;height:100%;min-height:0}
header{width:224px;min-width:224px;flex:none;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:22px 14px;background:#fff;border:0;border-right:1px solid var(--line);box-shadow:4px 0 24px #34233f08}
header b{font-size:20px;letter-spacing:-.04em;color:var(--wine);margin:0 0 20px;padding:4px 10px 18px;border-bottom:1px solid var(--line)}
header button{width:100%;text-align:left;justify-content:flex-start;border-radius:10px;padding:11px 13px;background:transparent!important;color:#665b70!important;font-weight:550;box-shadow:none!important}
header button:hover{background:var(--soft)!important;color:var(--wine)!important}
header button:first-of-type{background:#eee8f7!important;color:var(--wine)!important}
#main{min-width:0;min-height:0;flex:1;overflow:auto;padding:28px 34px;background:var(--bg)}
h1,h2,h3{color:#35283f;letter-spacing:-.025em}
button{border:0;border-radius:9px;padding:9px 14px;background:var(--lav);color:#35283f;font-weight:600;box-shadow:none;transition:background .15s,transform .08s}
button:hover{background:#bba8df;box-shadow:none;filter:none}
button:active{transform:scale(.98)}
button.on{background:var(--wine)!important;color:white!important;box-shadow:0 0 0 2px #fff,0 0 0 4px #b89acb!important}
input,select,textarea{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid #c8b8e8;outline-offset:1px}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card,.box{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.card{transition:box-shadow .16s,border-color .16s,transform .16s}
.card:hover{border-color:#c8b8e8;box-shadow:0 10px 28px #34233f18;transform:translateY(-1px)}
.card.new{border:1.5px dashed #bba8d5;background:#fcfaff;box-shadow:none;color:var(--wine)}
.mut{color:var(--mut)}
.li{border-color:var(--line)}
.gate{background:var(--bg)}
.box{border-radius:18px}
.bfull{background:var(--bg)}
.wrap{background-color:#fbfaff}
.wrap.dots{background-image:radial-gradient(#d9cfe7 1.2px,transparent 1.2px);background-size:22px 22px}
.bar,.menu .mp{background:#fff;border:1px solid var(--line);box-shadow:0 8px 28px #34233f1c;border-radius:13px}
.tbar{left:50%;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);flex-direction:row;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;padding:8px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 8px 28px #34233f1c}
.tbar .sep{width:26px;height:1px;background:var(--line);margin:3px 0}
.tbtn{width:42px;height:42px;border-radius:10px}
.tbtn.on{background:var(--wine)!important;color:#fff!important;box-shadow:none!important}
.pop{border:1px solid var(--line);background:#fff;box-shadow:0 8px 28px #34233f1c;border-radius:14px}
.mbtn,.vtop{border-radius:10px;box-shadow:0 5px 18px #34233f18}
.mbtn{background:#fff!important;color:var(--wine)!important;border:1px solid var(--line)}
.menu{display:flex;gap:8px;align-items:flex-start}.menu .mp{position:absolute;top:42px;left:0;max-height:calc(100dvh - 100px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}.homebtn{padding:8px 12px}.menu>.mbtn:not(.homebtn){padding:8px 12px}
.toast{background:var(--wine);color:#fff;border:0;border-radius:10px}
.it.rr .bgl,.it.rect .bgl,.it.pill .bgl,.it.oval .bgl{border-color:#b8a5d0}
.it.frame .bgl{border-color:#9a80ba}
.it>i{background:#9275b5}
.it.sel{outline-color:#9275b5}
.g{border-color:#9275b5}
.vwin{background:#292230;border:1px solid #46364e;border-radius:16px;box-shadow:0 18px 50px #24152d55}
.vh{color:#fff;border:0}
.vwin button{background:#5d496b!important;color:#fff!important;border:0}
.vwin button:hover{background:#765b85!important}
.vwin button.on{background:#a98bc9!important;color:#251b2d!important;box-shadow:none!important}
.vwin button.off{background:#a9435d!important}
.vgrid{gap:8px;padding:8px}
.vwin .tile{border-radius:12px}
.vbar{background:#352a3d;border:0;border-radius:12px}
.device-select{border-radius:8px;background:#fff;color:#30283b}
.readonly .tbar,.readonly .hist,.readonly .fbar,.readonly .vtop{display:none!important}

  const lesson=[`# Урок: ${title}`,'','## Цели урока',...terms.slice(0,4).map(t=>`• Разобраться в понятии «${t.t}»`),'• Уметь пересказать основные идеи материала своими словами','',
    '## Ключевые понятия',...terms.map(t=>'• '+(t.def.toLowerCase().startsWith(t.t.slice(0,4))?t.def:t.t[0].toUpperCase()+t.t.slice(1)+' — '+t.def)),'',
    ...blocks.flatMap((b,i)=>[`## Блок ${i+1}`,b,'']),'## Краткие выводы',...sum,'',
    '## Закрепление (устно)',...terms.slice(0,5).map((t,i)=>`${i+1}. Что такое «${t.t}»? Объясните своими словами.`)].join('\n');
  const hw=[`# Домашнее задание: ${title}`,'','## Часть 1. Вставьте пропущенное слово',...cl.slice(0,6).map((c,i)=>`${i+1}. ${c.q}`),'',
    '## Часть 2. Ответьте на вопросы',...terms.slice(0,4).map((t,i)=>`${i+1}. Дайте определение понятия «${t.t}» и приведите пример.`),'',
    '## Часть 3. Творческое задание','Составьте краткий конспект урока (5–7 предложений) и придумайте один собственный пример по теме.','',
    '## Ключ (для преподавателя)','Часть 1: '+cl.slice(0,6).map((c,i)=>`${i+1}) ${c.a}`).join('; '),...terms.slice(0,4).map(t=>`«${t.t}»: ${t.def}`)].join('\n');
  return{title,lesson,hw};
}
/*EDU-END*/
async function eduView(m){
  const mat=(await load('edu/materials'))||{items:[]},les=(await load('edu/lessons'))||{items:[]};
  const list=E('div'),out=E('pre',{textContent:'Загрузите материалы (PDF или текст), введите тему и нажмите «Собрать».'}),hist=E('div'),stt=E('div',{className:'mut'});let curTxt='';
  const draw=()=>{list.replaceChildren(...mat.items.map(x=>E('div',{className:'li'},E('span',{textContent:`${x.name} · ${x.text.length} симв.`}),B('✕',async()=>{mat.items=mat.items.filter(y=>y.id!==x.id);await save('edu/materials',mat);draw()}))));
    hist.replaceChildren(...les.items.slice().reverse().map(x=>E('div',{className:'li'},E('span',{textContent:x.title}),B('Открыть',()=>{curTxt=x.text;out.textContent=x.text}))))};
  const fi=E('input',{type:'file',multiple:true,accept:'.pdf,.txt,.md,.csv,.json,.html',onchange:async()=>{
    for(const f of fi.files){try{stt.textContent='Читаю '+f.name+'…';let t;
      if(/\.pdf$/i.test(f.name)){const lib=await pdfjs(),doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;t='';
        for(let i=1;i<=doc.numPages;i++){const c=await(await doc.getPage(i)).getTextContent();t+=c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n'}}
      else t=await f.text();
      if(t.trim().length<100)alert(`В «${f.name}» почти нет текста (возможно, это скан). Распознавание сканов пока не поддерживается.`);
      else mat.items.push({id:uid(),name:f.name,text:t.slice(0,400000)})}catch{alert('Не удалось прочитать '+f.name)}}
    stt.textContent='';await save('edu/materials',mat);fi.value='';draw()}});
  const topic=E('input',{placeholder:'Тема / ключевые слова (можно пусто)',size:32}),len=E('select',{},...[['Короткий',10],['Средний',18],['Подробный',30]].map(([l,v])=>E('option',{value:v,textContent:l,selected:v===18})));
  const gen=async k=>{
    if(!mat.items.length){out.textContent='Сначала загрузите материалы.';return}
    const r=build(mat.items.map(x=>x.text).join('\n\n'),topic.value.trim(),+len.value);
    if(!r){out.textContent='Слишком мало текста для построения урока.';return}
    curTxt=k==='l'?r.lesson:k==='h'?r.hw:r.lesson+'\n\n'+r.hw;out.textContent=curTxt;
    les.items.push({title:r.title+' · '+new Date().toLocaleDateString('ru'),text:curTxt});await save('edu/lessons',les);draw()};
  const dl=()=>{const a=E('a',{href:URL.createObjectURL(new Blob([curTxt],{type:'text/markdown'})),download:'урок.md'});a.click()};
  m.append(E('h2',{textContent:'Образование'}),
    E('div',{className:'card noprint'},E('b',{textContent:'1. Материалы'}),fi,E('div',{className:'mut',textContent:'PDF читается прямо в браузере, без ИИ и без интернета. Сканы (картинки в PDF) пока не распознаются.'}),stt,list),
    E('div',{className:'card noprint',style:'margin-top:12px'},E('b',{textContent:'2. Собрать'}),E('div',{className:'row'},topic,len),
      E('div',{className:'row'},B('Урок',()=>gen('l')),B('Домашнее задание',()=>gen('h')),B('Урок + ДЗ',()=>gen('a')),B('⬇ Скачать .md',dl),B('🖨 Печать / PDF',()=>print()))),
    E('div',{style:'margin:12px 0'},out),E('div',{className:'noprint'},E('b',{textContent:'История'}),hist));
  draw();
}
start();
</script></body></html>
