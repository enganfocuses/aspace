.hist{left:14px}.zoom{right:14px}.zoom button{padding:6px 12px;min-width:38px}.zl{min-width:48px;text-align:center;font-size:13px}

.menu .mp.open{display:flex}.menu .mp button{text-align:left}.menu .mp{max-height:calc(100dvh - 110px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}.menu{max-width:calc(100vw - 24px)}.menu .mp{max-width:calc(100vw - 24px)}
.vtop{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:12px;z-index:30;box-shadow:0 8px 28px #3a3a4624}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);display:none;background:var(--btn);border:1px solid var(--line);border-radius:999px;padding:6px 16px;z-index:60}
.it{position:absolute;color:#3a3a46}
.bgl{position:absolute;inset:0;pointer-events:none}
.it.note .bgl{border-radius:8px;box-shadow:0 4px 12px #3a3a4626}
.it.rr .bgl,.it.rect .bgl,.it.pill .bgl,.it.oval .bgl{border:1px solid #7f9bbd;box-shadow:0 3px 10px #3a3a4618}
.it.rr .bgl{border-radius:26px}.it.rect .bgl{border-radius:6px}.it.pill .bgl{border-radius:999px}.it.oval .bgl{border-radius:50%}
.k-diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.k-triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}
.k-star{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}.k-hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.it.img{cursor:move;touch-action:none}.it.img .bgl{border-radius:22px;overflow:hidden;box-shadow:0 4px 18px #3a3a4626}
.it.img img{width:100%;height:100%;object-fit:cover;display:block}.it.aud .bgl,.it.vid .bgl{display:flex;align-items:center;justify-content:center;background:#292230;border-radius:12px;padding:8px;overflow:hidden}.it.aud audio{max-width:100%}.it.vid video{max-width:100%;max-height:100%}
.it.emo{cursor:move;touch-action:none}.it.emo .bgl{display:grid;place-items:center;line-height:1}
.it.frame{pointer-events:none}.it.frame .bgl{border:2px solid #7f9bbd;border-radius:12px;background:#ffffff66}
.it.frame .fl,.it.frame>i,.it.frame .g,.it.frame .sb{pointer-events:auto}
.fl{position:absolute;left:0;top:-32px}.fl .t{white-space:nowrap;font-weight:600;min-width:70px;padding:2px 8px;width:auto}
.tw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px 12px}
.it.note .tw{align-items:flex-start;justify-content:flex-start}
.t{display:block;width:100%;max-height:100%;overflow:hidden;text-align:center;outline:none;white-space:pre-wrap;word-break:break-word;line-height:1.3;min-height:1.3em}
.it.note .t{text-align:left}.it.txt .tw{padding:2px}
.it.txt:hover .bgl,.it.txt.sel .bgl{outline:1px dashed #7f9bbd;outline-offset:2px}
.it>i{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:46px;height:10px;border-radius:99px;background:#7f9bbd99;cursor:move;opacity:0;transition:opacity .15s;z-index:2;touch-action:none}
.it:hover>i,.it.sel>i{opacity:1}
.it.sel{outline:2px solid #7f9bbd;outline-offset:3px;border-radius:6px}
.g{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;border-radius:50%;background:#fffef9;border:2px solid #7f9bbd;cursor:nwse-resize;display:none;z-index:3;touch-action:none}
.it.sel .g{display:block}
.sb{position:absolute;right:0;top:-46px;display:none;gap:4px;z-index:3}.it.sel .sb{display:flex}.sb button{width:32px;height:32px;padding:0}
.vwin{position:fixed;right:16px;top:72px;width:340px;height:270px;min-width:220px;min-height:120px;z-index:40;background:#1f1f2b;border-radius:22px;overflow:hidden;box-shadow:0 10px 34px #0006;resize:both;display:flex;flex-direction:column}

.vwin button.on{box-shadow:0 0 0 2px #1f1f2b,0 0 0 4px var(--btn)}.vwin button.off{background:#e5484d;border-color:#e5484d}

.vwin .tile{width:100%}.vbar .ic{width:18px;height:18px}

.vwin:hover .vbar{opacity:1}
@media(hover:none){.vbar{opacity:1}.it>i{opacity:1}}
.vwin.min{height:auto!important;min-height:0;resize:none}.vwin.min .vgrid,.vwin.min .vbar{display:none}
.vwin:fullscreen{width:100vw;height:100vh;border-radius:0;resize:none}.vwin:fullscreen .vgrid{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}

/* Aspace · Miro-inspired lavender & wine workspace */
:root{--bg:#f7f5fa;--card:#fff;--ink:#30283b;--mut:#81778b;--lav:#c8b8e8;--lav-deep:#8065ad;--wine:#71384f;--wine-dark:#54283c;--line:#e7e1ed;--soft:#f0ebf6;--shadow:0 5px 22px #34233f12}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:row;height:100%;min-height:0}
header{width:224px;min-width:224px;flex:none;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:22px 14px;background:#fff;border:0;border-right:1px solid var(--line);box-shadow:4px 0 24px #34233f08}
header b{font-size:20px;letter-spacing:-.04em;color:var(--wine);margin:0 0 20px;padding:4px 10px 18px;border-bottom:1px solid var(--line)}
header button{width:100%;text-align:left;justify-content:flex-start;border-radius:10px;padding:11px 13px;background:transparent!important;color:#665b70!important;font-weight:550;box-shadow:none!important}
header button:hover{background:var(--soft)!important;color:var(--wine)!important}
header button:first-of-type{background:#eee8f7!important;color:var(--wine)!important}
#main{min-width:0;min-height:0;flex:1;overflow:auto;padding:28px 34px;background:var(--bg)}
h1,h2,h3{color:#35283f;letter-spacing:-.025em}
button{border:0;border-radius:9px;padding:9px 14px;background:var(--lav);color:#35283f;font-weight:600;box-shadow:none;transition:background .15s,transform .08s}
button:hover{background:#bba8df;box-shadow:none;filter:none}
button:active{transform:scale(.98)}
button.on{background:var(--wine)!important;color:white!important;box-shadow:0 0 0 2px #fff,0 0 0 4px #b89acb!important}
input,select,textarea{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid #c8b8e8;outline-offset:1px}
.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card,.box{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.card{transition:box-shadow .16s,border-color .16s,transform .16s}
.card:hover{border-color:#c8b8e8;box-shadow:0 10px 28px #34233f18;transform:translateY(-1px)}
.card.new{border:1.5px dashed #bba8d5;background:#fcfaff;box-shadow:none;color:var(--wine)}
.mut{color:var(--mut)}
.li{border-color:var(--line)}
.gate{background:var(--bg)}
.box{border-radius:18px}
.bfull{background:var(--bg)}
.wrap{background-color:#fbfaff}
.wrap.dots{background-image:radial-gradient(#d9cfe7 1.2px,transparent 1.2px);background-size:22px 22px}
.bar,.menu .mp{background:#fff;border:1px solid var(--line);box-shadow:0 8px 28px #34233f1c;border-radius:13px}
.tbar{left:50%;top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);flex-direction:row;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;padding:8px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 8px 28px #34233f1c}
.tbar .sep{width:26px;height:1px;background:var(--line);margin:3px 0}
.tbtn{width:42px;height:42px;border-radius:10px}
.tbtn.on{background:var(--wine)!important;color:#fff!important;box-shadow:none!important}
.pop{border:1px solid var(--line);background:#fff;box-shadow:0 8px 28px #34233f1c;border-radius:14px}
.mbtn,.vtop{border-radius:10px;box-shadow:0 5px 18px #34233f18}
.mbtn{background:#fff!important;color:var(--wine)!important;border:1px solid var(--line)}
.menu{display:flex;gap:8px;align-items:flex-start}.menu .mp{position:absolute;top:42px;left:0;max-height:calc(100dvh - 100px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}.homebtn{padding:8px 12px}.menu>.mbtn:not(.homebtn){padding:8px 12px}
.toast{background:var(--wine);color:#fff;border:0;border-radius:10px}
.it.rr .bgl,.it.rect .bgl,.it.pill .bgl,.it.oval .bgl{border-color:#b8a5d0}
.it.frame .bgl{border-color:#9a80ba}
.it>i{background:#9275b5}
.it.sel{outline-color:#9275b5}
.g{border-color:#9275b5}
.vwin{background:#292230;border:1px solid #46364e;border-radius:16px;box-shadow:0 18px 50px #24152d55}
.vh{color:#fff;border:0}
.vwin button{background:#5d496b!important;color:#fff!important;border:0}
.vwin button:hover{background:#765b85!important}
.vwin button.on{background:#a98bc9!important;color:#251b2d!important;box-shadow:none!important}
.vwin button.off{background:#a9435d!important}
.vgrid{gap:8px;padding:8px}
.vwin .tile{border-radius:12px}
.vbar{background:#352a3d;border:0;border-radius:12px}
.device-select{border-radius:8px;background:#fff;color:#30283b}
.readonly .tbar,.readonly .hist,.readonly .fbar{display:none!important}

/* Совместный просмотр сайта рядом с доской */
.site-panel{position:absolute;right:0;top:0;bottom:0;width:50%;z-index:18;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}

<script>
const $=s=>document.querySelector(s);
const E=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e};

const uid=()=>Math.random().toString(36).slice(2,9);
const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const themeIsDark=()=>ls.g('aspace-theme','light')==='dark';

applyTheme();
if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Aspace offline shell:',e)));}
const CAPS=Promise.resolve();
const DB=()=>((window.CFG&&CFG.db)||'').replace(/\/$/,'');
let auth=null,currentUser=null,activeShareToken=null,storage=null;
const usageTracker=AspaceUsage.create({scope:CFG.ownerUid,
 enabled:()=>currentUser?.uid===CFG.ownerUid,firebaseURL:DB(),
 cloudflareURL:CFG.reserve?.url||'https://aspace-fallback-api.anncodes001.workers.dev'});
// One automatic transport for the existing owner and student board UI.
const standbyOptIn=()=>CFG.reserve?.enabled!==false&&new URLSearchParams(location.search).get('standby')!=='off';
const standbyKey=p=>/^boards\/[A-Za-z0-9_-]+$/.test(p);
let boardRuntimePromise=null;const syncStates=new Map();
function getBoardRuntime(){
 if(!standbyOptIn())return Promise.resolve(null);

  module.createBoardRuntime({databaseURL:DB(),baseUrl:CFG.reserve?.url||'https://aspace-fallback-api.anncodes001.workers.dev',
   getOwner:()=>currentUser?.uid===CFG.ownerUid?currentUser:null,
   local:{get:localGet,put:localPut,all:localAll,remove:localDelete},fetchImpl:rawFetch,
   onStatus:info=>{if(Number.isFinite(info.bytes))usageTracker.recordSummary(info.key,info);syncStates.set(info.key,info);window.dispatchEvent(new CustomEvent('aspace-sync-status',{detail:info}))}
  })));
}
async function boardProvider(id,token=null){const runtime=await getBoardRuntime();
 if(!runtime)return null;return token?runtime.shared(token):runtime.provider(id)}
const guestStandbyEnabled=standbyOptIn;
const MAX_UPLOAD_BYTES=6*1024*1024;
// Keep D1 share permissions aligned with
// the same Firebase token. Never ship the raw token to Cloudflare D1.
const shareOpChains=new Map();
async function sendStandbyShareOp(op){
 const previous=shareOpChains.get(op.key)||Promise.resolve();
 const work=previous.catch(()=>{}).then(()=>{
  const run=()=>applyStandbyShareOp(op);
  return navigator.locks?navigator.locks.request('aspace-share:'+op.ownerUid+':'+op.key,run):run();
 });
 shareOpChains.set(op.key,work);
 try{return await work}finally{if(shareOpChains.get(op.key)===work)shareOpChains.delete(op.key)}
}
async function applyStandbyShareOp(op){
 const latest=await localGet('shareOps',op.key);
 if(latest?.id!==op.id)return;

 if(currentUser?.uid!==op.ownerUid||op.ownerUid!==CFG.ownerUid)throw Error('Нужен вход владельца');
 const base=CFG.reserve?.url||'https://aspace-fallback-api.anncodes001.workers.dev';
 const send=async(path,method='GET',body=null)=>{
  const res=await rawFetch(base+path,{method,headers:{Authorization:'Bearer '+await currentUser.getIdToken(),
   ...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',referrerPolicy:'no-referrer'});
  if(!res.ok)throw Error('Cloudflare HTTP '+res.status);return res.json();
 };
 const current=await send('/v1/shares?docKey='+encodeURIComponent('boards/'+op.boardId));
 const exists=(current.shares||[]).find(x=>x.tokenHash===op.key);
 if(op.revoking){if(exists&&!exists.revoked)await send('/v1/shares/'+op.key,'DELETE')}
 else if(exists?.revoked)throw Error('Отозванную ссылку нельзя восстановить');
 else if(exists){if(exists.role!==op.role)await send('/v1/shares/'+op.key,'PATCH',{role:op.role})}
 else await send('/v1/shares','POST',{tokenHash:op.key,docKey:'boards/'+op.boardId,role:op.role});
 const pending=await localGet('shareOps',op.key);
 if(pending?.id===op.id)await localDelete('shareOps',op.key);
}
async function syncStandbyShare(boardId,token,role,revoking=false){
 if(!standbyOptIn()||currentUser?.uid!==CFG.ownerUid||!token)return {skipped:true};
 if(!/^[a-f0-9]{48}$/.test(token)||!/^[A-Za-z0-9_-]{1,120}$/.test(boardId)||
   !revoking&&!['viewer','editor'].includes(role))throw Error('Неверный формат доступа');

  .map(x=>x.toString(16).padStart(2,'0')).join('');

 // Persist intent before network requests; a failed revocation remains visible
 // and retries after reconnect/reload without storing raw capability tokens.
 const prior=await localGet('shareOps',hash);
 if(prior?.revoking&&!revoking)throw Error('Отзыв этой ссылки ещё выполняется');
 await localPut('shareOps',op);await sendStandbyShareOp(op);return {confirmed:true};
}
let retryingShares=false;
async function retryStandbyShareOps(){
 if(retryingShares||currentUser?.uid!==CFG.ownerUid||!standbyOptIn())return;
 retryingShares=true;
 try{for(const op of await localAll('shareOps'))if(op.ownerUid===currentUser?.uid)
  try{await sendStandbyShareOp(op)}catch(error){console.warn('Aspace permission sync pending:',error.message)}
 }finally{retryingShares=false}
}
addEventListener('online',()=>{void retryStandbyShareOps()});
setInterval(()=>{void retryStandbyShareOps()},30000);
const notifyStandbyGrantError=error=>{
  alert('Firebase обновлён, но резервный доступ Cloudflare НЕ подтверждён: '+
    error.message+'. Ссылку нельзя считать полностью синхронизированной. '+
    'Проверь раздел «Резерв Cloudflare».');

const shareURL=token=>DB()+'/shares/'+encodeURIComponent(token);
const shareRead=async(token,part)=>{

 if(!response.ok)throw Object.assign(new Error('Ссылка недоступна (Firebase HTTP '+response.status+')'),{status:response.status});

};

  headers:expectedEtag?{'if-match':expectedEtag}:{},body:value===null?null:JSON.stringify(value)});

 await shareWrite(token,'meta',{...meta,role:'viewer'});

  if(!res.ok)throw Error('Не удалось завершить отзыв ссылки: HTTP '+res.status);
 }
};

const dbUrl=async url=>{if(!auth||!auth.currentUser||!url.startsWith(DB()+'/')||new URL(url).searchParams.has('auth'))return url;try{const token=await auth.currentUser.getIdToken();return url+(url.includes('?')?'&':'?')+'auth='+encodeURIComponent(token)}catch{return url}};

/* Локальное хранилище Aspace: IndexedDB + очередь синхронизации */
const LOCAL_DB='aspace-local-v1';let localDbPromise=null;
function localDB(){
 if(!('indexedDB'in window))return Promise.reject(new Error('IndexedDB недоступна'));
 if(localDbPromise)return localDbPromise;
 localDbPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open(LOCAL_DB,3);
  req.onupgradeneeded=()=>{const db=req.result;
   if(!db.objectStoreNames.contains('docs'))db.createObjectStore('docs',{keyPath:'key'});
   if(!db.objectStoreNames.contains('pending'))db.createObjectStore('pending',{keyPath:'key'});
   if(!db.objectStoreNames.contains('assets'))db.createObjectStore('assets',{keyPath:'key'});
   if(!db.objectStoreNames.contains('assetPending'))db.createObjectStore('assetPending',{keyPath:'key'});
   if(!db.objectStoreNames.contains('shareCache'))db.createObjectStore('shareCache',{keyPath:'key'});
   if(!db.objectStoreNames.contains('guestDrafts'))db.createObjectStore('guestDrafts',{keyPath:'key'});
   if(!db.objectStoreNames.contains('shareOps'))db.createObjectStore('shareOps',{keyPath:'key'});
  };
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Не удалось открыть локальную базу'));

async function localGet(store,key){const db=await localDB();return new Promise((resolve,reject)=>{const q=db.transaction(store,'readonly').objectStore(store).get(key);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}

async function load(p){
 if(standbyOptIn()&&currentUser?.uid===CFG.ownerUid&&standbyKey(p)){
  const provider=await boardProvider(p.slice(7)),result=await provider.read();
  await localPut('docs',{key:p,value:result.value,updatedAt:Date.now()});return result.value;

 let cached=null,pending=false;

// Lightweight Firebase signaling. Read and write permissions are both verified
// before offering a call; a timer must never report a successful SSE connection.
const room0={async join(name,customPath,onData=()=>{}){
  const me=uid()+uid(),handlers={},dead=[],
    base=DB()+(customPath||('/rooms/'+encodeURIComponent(name)));
  const preflight=await fetch(base+'.json?shallow=true',{cache:'no-store',signal:AbortSignal.timeout(6000)});
  if(!preflight.ok)throw new Error('Нет доступа к каналу видеозвонка (Firebase HTTP '+preflight.status+'). Проверь права гостевого доступа.');
  let closed=false,es=null,gc=null,hideRegistered=false;
  const flush=()=>{
    if(!dead.length)return;
    const data={};dead.splice(0).forEach(key=>data[key]=null);
    fetch(base+'.json',{method:'PATCH',body:JSON.stringify(data),keepalive:true}).catch(()=>{});
  };
  const onPageHide=()=>{closed=true;flush()};
  const deliver=value=>{
    if(value&&value.s&&value.s!==me&&value.t)
      (handlers[value.t]||[]).forEach(listener=>{
        let data=null;try{data=JSON.parse(value.d)}catch{}
        try{listener({data,isMe:false})}catch(error){console.warn('Aspace signaling listener:',error)}
      });
  };
  const api={
    id:me,
    emit:(type,data)=>fetch(base+'.json',{
      method:'POST',body:JSON.stringify({t:type,d:JSON.stringify(data),s:me})
    }).then(async response=>{
      if(!response.ok){console.warn('Aspace signal rejected',type,response.status);return false}
      const result=await response.json();
      if(!result?.name)return false;
      if(closed)fetch(base+'.json',{method:'PATCH',body:JSON.stringify({[result.name]:null}),keepalive:true}).catch(()=>{});
      else dead.push(result.name);
      return true;
    }).catch(error=>{console.warn('Aspace signal failed',type,error);return false}),
    on:(type,listener)=>{
      (handlers[type]=handlers[type]||[]).push(listener);
      return()=>{handlers[type]=handlers[type].filter(fn=>fn!==listener)};
    },
    close:()=>{
      if(closed)return;
      closed=true;
      if(hideRegistered)removeEventListener('pagehide',onPageHide);
      es?.close();if(gc)clearInterval(gc);flush();
    }
  };
  try{
    es=new EventSource(await eventUrl(base+'.json'));
    es.addEventListener('put',event=>{
      try{onData(event.data)}catch{}
      try{
        const message=JSON.parse(event.data);
        if(message.data==null)return;
        if(message.path==='/'){
          Object.values(message.data).forEach(value=>value&&typeof value==='object'&&deliver(value));
        }else if(message.path.split('/').length===2)deliver(message.data);
      }catch(error){console.warn('Aspace signal parse:',error)}
    });
    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{es.removeEventListener('open',success);es.removeEventListener('error',failure);reject(new Error('Не удалось подключить канал звонка за 9 секунд'))},9000);
      const success=()=>{clearTimeout(timer);es.removeEventListener('error',failure);resolve()};
      const failure=()=>{clearTimeout(timer);es.removeEventListener('open',success);reject(new Error('Канал видеозвонка заблокирован или недоступен'))};
      es.addEventListener('open',success,{once:true});
      es.addEventListener('error',failure,{once:true});
    });
    // Test write authorization once; a readable SSE stream alone cannot
    // guarantee that callers are able to send offers/answers.
    const probe=await fetch(base+'.json',{method:'POST',body:JSON.stringify({t:'ready',d:'{}',s:me})});
    if(!probe.ok)throw new Error('Нет права отправлять сигналы (Firebase HTTP '+probe.status+').');
    const ping=await probe.json();
    if(!ping?.name)throw new Error('Сервер сигналинга не принял тестовое сообщение');
    dead.push(ping.name);
    gc=setInterval(flush,10000);
    addEventListener('pagehide',onPageHide,{once:true});hideRegistered=true;
    return api;
  }catch(error){es?.close();if(gc)clearInterval(gc);throw error}
}};

    if(match)return{kind:'embed',url:'https://player.vimeo.com/video/'+match[1],host:'Vimeo'};

  }

  }

}

const stem=w=>{if(w.length<=4)return w;const r=w.replace(/(ами|ями|ого|его|ому|ему|ыми|ими|ах|ях|ов|ев|ей|ом|ем|ам|ям|ою|ею|ую|юю|ая|яя|ое|ее|ие|ые|ий|ый|ой|ing|es|ed|s|а|я|о|е|ы|и|у|ю|ь|й)$/,'');return r.length>=4?r:w};
const words=s=>(s.toLowerCase().match(/[a-zа-яё]{4,}/g)||[]).filter(w=>!STOP.has(w));
const sents=t=>t.replace(/-\n/g,'').replace(/\s*\n\s*/g,' ').replace(/\s+/g,' ').split(/(?<=[.!?…])\s+(?=[A-ZА-ЯЁ«"(\d])/).map(s=>s.trim()).filter(s=>s.length>=40&&s.length<=320);
const DEF=/ — | это |называ|являет|определя|представляет|means|is a |refers to/i;
function build(text,topic,N=18){
  const all=sents(text);if(all.length<3)return null;
  const f={},fm={};all.forEach(s=>words(s).forEach(w=>{const k=stem(w);f[k]=(f[k]||0)+1;fm[k]=fm[k]||{};fm[k][w]=(fm[k][w]||0)+1}));
  const ts=words(topic||'').map(stem);
  const sc=s=>{const ks=words(s).map(stem);if(!ks.length)return 0;const base=ks.reduce((a,k)=>a+Math.log(1+f[k]),0)/ks.length,hit=ks.filter(k=>ts.some(t=>k.startsWith(t)||t.startsWith(k))).length;return ts.length?(hit?base+hit*3:0):base+(DEF.test(s)?1:0)};
  let rk=all.map((s,i)=>({s,i,v:sc(s)})).filter(x=>x.v>0);if(rk.length<3)rk=all.map((s,i)=>({s,i,v:sc(s)}));
  const sel=rk.slice().sort((a,b)=>b.v-a.v).slice(0,N).sort((a,b)=>a.i-b.i);
  const tf={};sel.forEach(x=>words(x.s).forEach(w=>{const k=stem(w);tf[k]=(tf[k]||0)+1}));
  const terms=Object.keys(tf).filter(k=>tf[k]>1||sel.length<8).sort((a,b)=>tf[b]-tf[a]).slice(0,8).map(k=>{const t=Object.entries(fm[k]).sort((a,b)=>b[1]-a[1])[0][0];
    const c=sel.filter(x=>words(x.s).some(w=>stem(w)===k));return{k,t,def:(c.find(x=>DEF.test(x.s))||c[0]||{}).s}}).filter(x=>x.def);
  const cloze=(s,term)=>s.replace(new RegExp(term.t.slice(0,Math.max(4,term.t.length-2))+'[а-яёa-z]*','i'),m=>{term.a=m;return '_____'});
  const cl=terms.map(t=>{const x=sel.find(y=>y.s!==t.def&&words(y.s).some(w=>stem(w)===t.k));const o={...t};return x?{q:cloze(x.s,o),a:o.a}:null}).filter(Boolean);
  const blocks=[];for(let i=0;i<sel.length;i+=5)blocks.push(sel.slice(i,i+5).map(x=>x.s).join(' '));
  const sum=rk.slice().sort((a,b)=>b.v-a.v).slice(0,4).sort((a,b)=>a.i-b.i).map(x=>'• '+x.s);
  const title=topic||(terms[0]?'Тема: '+terms[0].t:'Урок');

    '## Ключевые понятия',...terms.map(t=>'• '+(t.def.toLowerCase().startsWith(t.t.slice(0,4))?t.def:t.t[0].toUpperCase()+t.t.slice(1)+' — '+t.def)),'',
    ...blocks.flatMap((b,i)=>[`## Блок ${i+1}`,b,'']),'## Краткие выводы',...sum,'',
    '## Закрепление (устно)',...terms.slice(0,5).map((t,i)=>`${i+1}. Что такое «${t.t}»? Объясните своими словами.`)].join('\n');
  const hw=[`# Домашнее задание: ${title}`,'','## Часть 1. Вставьте пропущенное слово',...cl.slice(0,6).map((c,i)=>`${i+1}. ${c.q}`),'',
    '## Часть 2. Ответьте на вопросы',...terms.slice(0,4).map((t,i)=>`${i+1}. Дайте определение понятия «${t.t}» и приведите пример.`),'',
    '## Часть 3. Творческое задание','Составьте краткий конспект урока (5–7 предложений) и придумайте один собственный пример по теме.','',
    '## Ключ (для преподавателя)','Часть 1: '+cl.slice(0,6).map((c,i)=>`${i+1}) ${c.a}`).join('; '),...terms.slice(0,4).map(t=>`«${t.t}»: ${t.def}`)].join('\n');
  return{title,lesson,hw};
}
